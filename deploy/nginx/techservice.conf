# /etc/nginx/sites-available/techservice  (ln -s ... sites-enabled/)
# HTTPS sertifikat: sudo certbot --nginx -d techservice.uz -d www.techservice.uz
# "techservice.uz" ni o'z domeningizga almashtiring.

upstream techservice_app {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name techservice.uz www.techservice.uz;
    # certbot sertifikat olganidan keyin bu blokni o'zi HTTPS'ga yo'naltiradi
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://techservice.uz$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name techservice.uz www.techservice.uz;

    ssl_certificate     /etc/letsencrypt/live/techservice.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/techservice.uz/privkey.pem;

    # www -> asosiy domen (SEO: bitta manzil)
    if ($host = www.techservice.uz) { return 301 https://techservice.uz$request_uri; }

    # Rasm yuklash: Django 10 MB gacha qabul qiladi, bir nechta rasm bitta so'rovda
    client_max_body_size 40m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /static/ {
        alias /srv/techservice/staticfiles/;
        expires 30d;
        add_header Cache-Control "public";
        # add_header blok ichida bo'lsa, server darajasidagilar meros qolmaydi — qayta yozamiz
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        access_log off;
    }

    # Ochiq media: usta rasmlari, ish rasmlari (EXIF tozalangan).
    # Ustalarning hujjatlari bu yerda EMAS — /srv/techservice/private_media (nginx bermaydi).
    location /media/ {
        alias /srv/techservice/media/;
        expires 7d;
        access_log off;
        # Yuklangan fayl hech qachon skript yoki HTML sifatida bajarilmasin
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'unsafe-inline'" always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        location ~* \.(html?|svg|js|php)$ { return 403; }
    }

    location / {
        proxy_pass http://techservice_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
